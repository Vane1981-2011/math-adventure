<html lang="zh-CN"><head>

<meta property="og:title" content="数学大冒险 · 巅峰试炼">
<meta property="og:description" content="9 座数学试炼塔、108 道初中数学题，随机抽题闯关，支持错题复习与知识点训练。">
<meta property="og:type" content="website">
<title>数学大冒险 · 巅峰试炼</title>
<style>
/* ================================================================
   设计系统 v2 · 双场景
   学习场景（花瓣风）：米白底 / 白卡 / 大留白 / 图片优先 / 细阴影
   战斗场景（竞技场）：近黑底 / 橙金 / 高对比
   ================================================================ */
:root{
  --accent:#e0582a; --accent2:#d9542a; --gold:#c99a3c;
  --ok:#3f8f52; --err:#c9493c;
  --r-lg:18px; --r-md:14px; --r-sm:10px;
  --shadow-1:0 2px 10px rgba(90,70,40,.06);
  --shadow-2:0 10px 26px rgba(90,70,40,.12);
}
body[data-scene="learn"], body{
  --bg:#f7f4ef; --bg2:#f2ece1;
  --card:#ffffff; --surface:#fbf9f5; --hover:#f1ece3;
  --border:#e9e2d6; --border2:#f0e9dd;
  --t1:#2d2a26; --t2:#6f6a61; --t3:#6b645a;
  --obg:#eef6ef; --ebg:#fdeeea;
  --navbg:rgba(255,255,255,.92);
  --chipbg:#f8f1e4; --chiptx:#8a6b3f;
  --gold:#c99a3c;
}
body[data-scene="battle"]{
  --bg:#0a0806; --bg2:#120d09;
  --card:#14110e; --surface:#1a1612; --hover:#221d18;
  --border:#2a241e; --border2:#241d17;
  --t1:#e8e0d8; --t2:#a09888; --t3:#948a7c;
  --obg:rgba(106,158,110,.12); --ebg:rgba(192,80,64,.10);
  --navbg:rgba(14,10,6,.92);
  --chipbg:#221b14; --chiptx:#c9a06a;
  --gold:#d4a843;
  --shadow-1:0 2px 10px rgba(0,0,0,.3);
  --shadow-2:0 10px 26px rgba(0,0,0,.45);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  min-height:100vh;min-height:100dvh;
  background:var(--bg);color:var(--t1);
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;
  font-size:16px;line-height:1.6;
  overflow-x:hidden;-webkit-tap-highlight-color:transparent;
  transition:background .25s ease,color .25s ease;
}
button,input{font-family:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@keyframes fi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fi2{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ================= 登录 / 选角 ================= */
#lv{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:24px 20px;overflow-y:auto;background:
  radial-gradient(ellipse at 50% -10%,rgba(201,154,60,.10),transparent 60%),
  radial-gradient(ellipse at 100% 100%,rgba(224,88,42,.05),transparent 55%),
  var(--bg)}
#lv.active{display:flex}
.lm{position:relative;z-index:1;width:100%;max-width:430px;animation:fi2 .6s ease}
.llo{text-align:center;margin-bottom:4px}
.lti{display:flex;justify-content:center;gap:.06em;font-family:'Songti SC','Noto Serif SC',Georgia,serif;font-weight:700;margin-bottom:2px}
.lti span{font-size:clamp(2rem,6.4vw,2.5rem);background:linear-gradient(180deg,#4a4136 0%,#7a6340 55%,#c99a3c 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.02em}
.lssp{display:inline-block;width:1.7em}  /* 字母间距已用于字间，词间需额外留白才分得开 */
.lsu{text-align:center;color:#6f6557;margin-bottom:6px;white-space:nowrap;
  font-size:clamp(10px,.55vw + 9px,12px);letter-spacing:clamp(1.6px,.9vw,5px)}
.lhh{text-align:center;font-size:12px;letter-spacing:2px;color:#6f6557;margin:22px 0 -4px}
.lhg{display:grid;grid-template-columns:repeat(3,1fr);gap:20px 12px;margin:14px 0 22px}
.lhc{display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:transform .25s ease}
.lhc:hover{transform:translateY(-3px)}
.lhc:focus-visible{outline-offset:6px;border-radius:20px}
.lhf{width:86px;height:86px;border-radius:24px;position:relative;overflow:hidden;background:var(--card);
  border:2px solid var(--border2);box-shadow:var(--shadow-1);transition:border-color .25s,box-shadow .25s,transform .25s}
.lhi{position:absolute;inset:0}
.lhi img{width:100%;height:100%;object-fit:cover;display:block}
.lhc:hover .lhf{box-shadow:var(--shadow-2);transform:scale(1.02)}
.lhc.sel .lhf{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 0 0 4px rgba(201,154,60,.16),0 10px 24px rgba(201,154,60,.24)}
.lhn{margin-top:8px;font-size:12px;font-weight:600;color:var(--t2);letter-spacing:1px;transition:color .25s}
.lhc.sel .lhn{color:var(--gold)}
.lht{margin-top:2px;font-size:11px;color:#6f6557}
.lin{display:flex;justify-content:center;margin-bottom:12px}
.lin input{width:100%;max-width:330px;display:block;margin:0 auto;padding:14px 16px;border-radius:var(--r-md);outline:none;
  border:1.5px solid var(--border);background:var(--card);color:var(--t1);font-size:16px;text-align:center;
  transition:border-color .2s,box-shadow .2s}
.lin input::placeholder{color:#6f6557}
.lin input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(224,88,42,.08)}
.lin input.input-error{border-color:var(--err)!important;box-shadow:0 0 0 4px rgba(201,73,60,.10)!important;animation:shake .4s ease}
.lpw{position:relative;width:100%;display:flex;justify-content:center}
.lpt{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--t3);padding:10px;display:flex;align-items:center;justify-content:center;border-radius:8px}
.lpt:hover{color:var(--t2);background:var(--hover)}
.lpt svg{width:18px;height:18px}
.ler{text-align:center;font-size:13px;color:var(--err);margin:2px 0 6px;min-height:1.4em;line-height:1.5;opacity:0;transform:translateY(-4px);transition:.25s}
.ler.show{opacity:1;transform:translateY(0)}
.lfl{display:flex;justify-content:center;align-items:center;gap:18px;margin:4px 0 14px;font-size:14px}
.lfl a{color:#8a6b3f;text-decoration:none;cursor:pointer;padding:8px 4px;border-bottom:1px solid transparent;transition:.2s}
.lfl a:hover,.lfl a:focus-visible{border-bottom-color:rgba(201,154,60,.5);color:#6e5430}
.lfl .ldv{color:#d6cdbc}
.lbn{display:block;width:100%;max-width:330px;margin:0 auto;padding:15px;border:none;border-radius:var(--r-md);
  background:linear-gradient(135deg,#e8632f 0%,#d9542a 100%);color:#fff;font-size:17px;font-weight:700;letter-spacing:5px;
  box-shadow:0 4px 14px rgba(217,84,42,.28);transition:transform .2s,box-shadow .2s,opacity .2s}
.lbn:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(217,84,42,.34)}
.lbn:active{transform:scale(.98)}
.lbn:disabled,.lbn.disabled{opacity:.5;cursor:not-allowed;box-shadow:none;filter:grayscale(.2)}
.lenv{display:none;align-items:center;justify-content:center;gap:5px;margin-top:9px;padding:6px 10px;
  border-radius:8px;background:rgba(201,154,60,.10);border:1px solid rgba(201,154,60,.22);
  color:#9a7a3c;font-size:11.5px;line-height:1.45;text-align:center}
.lenv.show{display:flex}
.lenv svg{flex:0 0 auto}
#lock-back{display:none;font-size:13px;padding:8px 16px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--t2);margin-bottom:10px}

/* 注册弹窗 */
.rmb{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;background:rgba(45,42,38,.35);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:20px}
.rmb.active{display:flex}
.rmc{background:var(--card);border:1px solid var(--border2);border-radius:20px;padding:24px 22px;max-width:380px;width:100%;box-shadow:0 20px 50px rgba(60,45,25,.18);animation:fi2 .3s ease}
.rmt{text-align:center;font-size:18px;font-weight:700;color:var(--t1);margin-bottom:18px;font-family:'Songti SC','Noto Serif SC',serif}
.rmf{margin-bottom:12px}
.rmf label{display:block;font-size:13px;color:var(--t3);margin-bottom:6px}
.rmf input{width:100%;padding:13px 14px;border-radius:var(--r-sm);outline:none;border:1.5px solid var(--border);background:var(--surface);color:var(--t1);font-size:16px;text-align:center;transition:.2s}
.rmf input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(224,88,42,.08)}
.rme{color:var(--err);font-size:12px;margin-top:5px;text-align:center;min-height:1.05em;font-weight:600}
.rmf input.input-error{border-color:var(--err)!important;box-shadow:0 0 0 4px rgba(201,73,60,.10)!important;animation:shake .4s ease}
.rmb .lbn{font-size:16px;padding:13px;letter-spacing:3px}
.rmca{text-align:center;margin-top:14px;font-size:13px;color:var(--t3);cursor:pointer;padding:6px}
.rmca:hover{color:var(--t2)}
.rmc{max-height:calc(100vh - 40px);overflow-y:auto}
.rmh{font-size:12px;color:var(--t3);text-align:center;line-height:1.5;margin:-2px 0 12px}
.ler.info{color:#a8621f}
#go-register{color:var(--accent);font-weight:700}
#go-register.attn{background:#fdeeea;border-radius:6px}


/* ================= 主视图 ================= */
#cv{display:none;position:relative;z-index:1;max-width:640px;margin:0 auto;padding-bottom:92px;min-height:100vh}
#cv.active{display:block;animation:fi .4s ease}
.hd{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:14px 18px;
  background:var(--navbg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border2)}
.ha{width:44px;height:44px;border-radius:14px;overflow:hidden;flex-shrink:0;background:var(--hover);border:1px solid var(--border2)}
.ha img{width:100%;height:100%;object-fit:cover;display:block}
.hi{flex:1;min-width:0}
.hn{font-size:16px;font-weight:700;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hs{margin-top:2px}
.atb{display:flex;align-items:center;gap:6px;flex-shrink:0}
.atb-btn{display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:6px 12px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--t2);font-size:12px;transition:.2s}
.atb-btn:hover{background:var(--hover);color:var(--t1)}
.atb-btn.back{color:var(--accent);border-color:rgba(224,88,42,.25)}
.atb-btn.lock{color:#a8813c}
.atb-btn.exit{color:#b06a60}
.atb-btn svg{flex-shrink:0}
.xp-bar{display:flex;align-items:center;gap:8px;padding:8px 18px 6px;font-size:12px;color:var(--t3)}
.xp-bar span:first-child{white-space:nowrap;font-weight:600;color:var(--gold)}
.xp-track{flex:1;height:6px;border-radius:3px;background:var(--border);overflow:hidden}
.xp-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--gold),var(--accent));transition:width .5s}
#sx{white-space:nowrap;color:var(--t2)}
.ss{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 18px 12px}
.si{background:var(--card);border:1px solid var(--border2);border-radius:var(--r-md);padding:10px 4px;text-align:center;box-shadow:var(--shadow-1)}
.sv{font-size:17px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.sl{font-size:11px;color:var(--t3);margin-top:2px;letter-spacing:1px}
.rank{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;background:var(--hover);border:1px solid var(--border)}

/* 豆包助手条 */
.tsb{display:none;align-items:center;gap:8px;margin:0 18px 12px;padding:9px 12px;background:var(--card);border:1px solid var(--border2);border-radius:var(--r-md);font-size:12px;box-shadow:var(--shadow-1)}
#cv.active .tsb{display:flex}
.tsb-label{color:var(--t3);flex-shrink:0}
.tsb-url{color:var(--t1);font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tsb-status{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600;white-space:nowrap;flex-shrink:0}
.tsb-status.open{background:var(--obg);color:var(--ok)}
.tsb-status.closed{background:var(--ebg);color:var(--err)}
.tsb-btns{display:flex;gap:4px;flex-shrink:0}
.tsb-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--t2);font-size:15px;display:flex;align-items:center;justify-content:center;transition:.2s}
.tsb-btn:hover{background:var(--hover);color:var(--accent);border-color:var(--accent)}
.tsb-btn.disabled{opacity:.35;pointer-events:none}

/* ================= 塔地图（花瓣式卡片网格） ================= */
.sh{display:flex;align-items:baseline;gap:8px;padding:14px 18px 8px}
.st{font-size:17px;font-weight:700;color:var(--t1)}
.sx{font-size:12px;color:var(--t3)}
.tl{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:4px 18px 24px}
.tc{position:relative;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--border2);border-radius:var(--r-lg);padding:14px;cursor:pointer;box-shadow:var(--shadow-1);transition:transform .22s ease,box-shadow .22s ease}
.tc:hover{transform:translateY(-3px);box-shadow:var(--shadow-2)}
.tc:active{transform:scale(.985)}
.tc-visual{width:52px;height:52px;border-radius:16px;background:var(--chipbg);display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:10px}
.tcn{font-size:15px;font-weight:700;color:var(--t1)}
.tcchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tchip{font-size:11px;color:var(--chiptx);background:var(--chipbg);padding:2px 7px;border-radius:20px;white-space:nowrap}
.tcbar{height:4px;border-radius:2px;background:var(--border);margin-top:10px;overflow:hidden}
.tcbar i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,var(--gold),var(--accent));transition:width .5s}
.tcr{position:absolute;top:14px;right:14px;text-align:right}
.tcp{font-size:13px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.tcl{font-size:11px;color:var(--t3)}

/* ================= 战斗（竞技场） ================= */
.bp{max-width:600px;margin:0 auto;padding:16px 18px calc(96px + env(safe-area-inset-bottom))}
@media(max-height:780px){body[data-scene="battle"] #pb{align-items:flex-start}}
/* R5 战斗场景聚焦：隐去首页摘要与助手条，答题卡垂直居中 */
body[data-scene="battle"] .ss,
body[data-scene="battle"] .tsb{display:none!important}
body[data-scene="battle"] #pb{align-items:center;justify-content:center;min-height:calc(100vh - 140px);min-height:calc(100dvh - 140px)}
body[data-scene="battle"] #pb>.bp{width:100%}
.bb{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow-1)}
.bt{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.5px}
.bh{display:flex;align-items:center;gap:10px;margin:12px 0}
.bhb{flex:1;height:8px;border-radius:4px;background:var(--border);overflow:hidden}
.bhf{height:100%;border-radius:4px;transition:width .4s ease}
.bhp{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.bc{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--t3);margin-bottom:6px;flex-wrap:wrap}
.btim{font-weight:700;color:var(--gold)}
.bcc{font-weight:800;color:var(--accent);font-size:14px}
.bnote{font-size:12px;color:var(--ok);margin:4px 0 2px}
.bd{font-size:17px;font-weight:600;line-height:1.7;color:var(--t1);margin:10px 0 6px}
.bfig{margin:8px 0;color:var(--t2)}
.bfig svg{max-height:170px}
.bo{display:flex;flex-direction:column;gap:10px;margin:14px 0 4px}
.boi{width:100%;padding:14px 16px;border-radius:var(--r-md);border:1.5px solid var(--border);background:var(--surface);color:var(--t1);font-size:15px;text-align:left;line-height:1.5;transition:.18s}
.boi:hover{border-color:var(--accent);background:var(--hover)}
.boi.correct{border-color:var(--ok);background:var(--obg);animation:fi2 .25s ease}
.boi.wrong{border-color:var(--err);background:var(--ebg);animation:shake .35s ease}
.boi.dis{pointer-events:none;opacity:.62;cursor:default}
.boi.dis.correct,.boi.dis.wrong{opacity:1}
.qe{display:none;margin:12px 0 0;padding:12px 14px;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--border);font-size:14px;line-height:1.7;color:var(--t2)}
.qe.show{display:block;animation:fi .25s ease}
.bfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.bhint{font-size:12px;padding:9px 14px;border-radius:20px;border:1px dashed var(--gold);background:transparent;color:var(--gold);transition:.2s}
.bhint:hover{background:rgba(201,154,60,.08)}
.qn{border:none;border-radius:12px;background:var(--accent);color:#fff;padding:11px 22px;font-size:14px;font-weight:600;transition:.2s}
.qn:hover{filter:brightness(1.08);transform:translateY(-1px)}

/* ================= 结算 ================= */
.rp{padding:18px}
.rc{background:var(--card);border:1px solid var(--border2);border-radius:var(--r-lg);padding:24px 18px;text-align:center;box-shadow:var(--shadow-1)}
.ri{font-size:44px;line-height:1.1;margin-bottom:6px}
.rn{font-size:19px;font-weight:800;color:var(--t1)}
.rs{font-size:13px;color:var(--t3);margin-top:4px}
.rss{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border2);border-radius:var(--r-md);overflow:hidden;margin:16px 0}
.rsi{background:var(--card);padding:10px 2px}
.rsv{font-size:15px;font-weight:800;color:var(--accent)}
.rsl{font-size:11px;color:var(--t3);margin-top:2px}
.rbonus{font-size:13px;color:var(--gold);margin:6px 0;padding:8px;border-radius:8px;background:var(--chipbg)}
.rba,.rbb{min-height:44px;padding:11px 22px;border-radius:12px;font-size:14px;font-weight:600;border:none;margin:12px 4px 0;transition:.2s}
.rba{background:var(--accent);color:#fff}
.rbb{background:var(--surface);color:var(--t2);border:1px solid var(--border)}
.rba:hover{filter:brightness(1.06)}
.rbb:hover{background:var(--hover);color:var(--t1)}

/* ================= 战绩页 ================= */
.ps{display:none;padding-bottom:84px}
.ps .sh{margin-bottom:4px}
.rhead{background:var(--card);border:1px solid var(--border2);border-radius:var(--r-lg);padding:20px;margin:0 18px 14px;text-align:center;box-shadow:var(--shadow-1)}
.cl{display:flex;flex-direction:column;gap:8px;padding:0 18px}
.cc{background:var(--card);border:1px solid var(--border2);border-radius:var(--r-md);padding:12px 14px;box-shadow:var(--shadow-1)}
.cr{display:flex;align-items:center;gap:10px}
.cb{flex:1;min-width:0}
.rc3{background:var(--card);border:1px solid var(--border2);border-radius:var(--r-md);padding:10px 2px;text-align:center}
.rv{font-size:17px;font-weight:800;color:var(--accent)}
.rl2{font-size:11px;color:var(--t3);margin-top:2px}

/* ================= 复习 ================= */
.kpcard{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border2);border-radius:var(--r-md);padding:14px;margin:0 18px 10px;box-shadow:var(--shadow-1)}
.kbtn{border:none;background:linear-gradient(135deg,#e8632f,#d9542a);color:#fff;border-radius:10px;padding:10px 16px;font-size:13px;font-weight:600;white-space:nowrap;min-height:40px}
.kbtn:hover{filter:brightness(1.06)}
.rsum{background:var(--card);border:1px solid var(--border2);border-radius:var(--r-md);padding:14px;margin:14px 18px 0;box-shadow:var(--shadow-1)}
.rqcard{background:var(--card);border:1px solid var(--border2);border-radius:var(--r-lg);padding:16px;margin:0 18px 12px;box-shadow:var(--shadow-1)}
#pq{display:none;padding-bottom:90px}
#pq .sh{padding-top:8px}

/* ================= 错题本 ================= */
.wl{display:flex;flex-direction:column;gap:10px;padding:0 18px}
.wc{background:var(--card);border:1px solid var(--border2);border-radius:var(--r-md);padding:14px;box-shadow:var(--shadow-1)}
.wcq{font-size:14px;font-weight:600;line-height:1.6;color:var(--t1)}
.wca{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0;font-size:12px}
.wa{color:var(--err)}
.wcok{color:var(--ok)}
.wce{font-size:12px;color:var(--t2);background:var(--surface);border-radius:8px;padding:8px 10px;line-height:1.6}
.wcf{display:flex;justify-content:space-between;font-size:11px;color:var(--t3);margin-top:8px}

/* 空状态 */
.es{text-align:center;padding:44px 20px;color:var(--t3)}
.ei{font-size:36px;margin-bottom:8px}
.et{font-size:13px;line-height:1.7}

/* ================= 底部导航 ================= */
.bn{display:none;position:fixed;bottom:0;left:0;right:0;justify-content:space-around;
  padding:6px 0 calc(6px + env(safe-area-inset-bottom));
  background:var(--navbg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--border2);z-index:50}
#cv.active~.bn{display:flex}
.ni{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:64px;min-height:48px;padding:6px 12px;
  font-size:12px;font-weight:600;color:var(--t3);text-decoration:none;cursor:pointer;transition:color .2s;border-radius:10px}
.ni span{font-size:11px;letter-spacing:.5px}
.ni.active{color:var(--accent)}
.ni.active svg{stroke:var(--accent)}
.ni:hover{color:var(--t1)}

/* ================= 响应式 ================= */
@media(min-width:768px){
  #cv{max-width:760px}
  .tl{grid-template-columns:repeat(3,1fr)}
  .battle-wrap{max-width:640px}
}
@media(max-width:480px){
  /* 小屏头部：段位已在经验条重复显示，隐去徽章；操作按钮转图标式，给昵称让位 */
  .hs{display:none}
  .atb-btn{font-size:0;gap:0;padding:7px 10px}
  .atb-btn svg{width:16px;height:16px}
}
@media(max-width:380px){
  .lhf{width:74px;height:74px;border-radius:20px}
  .lhg{gap:16px 8px;margin:12px 0 18px}
  .lhh{margin:18px 0 -2px}
  .tl{gap:10px;padding:4px 14px 24px}
  .tcn{font-size:14px}
  .bd{font-size:16px}
}
@media(max-height:720px){
  /* 矮屏（667/640/568）：压缩纵向节奏，保证"开启试炼"按钮与版权行落在首屏内；
     内容仍可滚动兜底，顶部对齐避免溢出被裁 */
  #lv{align-items:flex-start;padding:14px 20px 18px}
  .lti span{font-size:1.85rem}
  .lhh{margin:14px 0 -2px}
  .lhg{gap:12px 8px;margin:10px 0 14px}
  .lhf{width:62px;height:62px;border-radius:18px}
  .lhn{margin-top:5px;font-size:11px}
  .lht{font-size:10px;margin-top:1px}
  .lin{margin-bottom:10px}
  .lfl{margin:2px 0 10px}
  .lbn{padding:13px}
}
@media(max-height:660px){
  /* 极矮屏（640/568）：进一步压缩。存储提示条会占约 30px，
     因此这里隐藏纯装饰性文案（英文副标题、星座分组标题、角色头衔），
     保证"标题—头像—两个输入—主按钮"全部落在首屏，滚动仅作兜底 */
  #lv{padding:8px 14px 12px}
  .lti span{font-size:1.45rem}
  .lsu{display:none}
  .lhh{display:none}
  .lhf{width:50px;height:50px;border-radius:15px}
  .lhn{font-size:10px;margin-top:3px}
  .lht{display:none}
  .lhg{gap:8px 6px;margin:6px 0 10px}
  .lin input{padding:11px 14px}
  .lin{margin-bottom:8px}
  .lfl{margin:0 0 8px}
  .lbn{padding:11px}
  .lenv{margin-top:6px;padding:4px 8px;font-size:10.5px}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>

function uidOf(s){var h=5381;for(var i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))|0}return 'u'+(h>>>0).toString(36)}
function shuffleArr(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

// ====== 存储适配层（沙箱/隐私模式兼容）======
// 预览面板、第三方嵌入常以 sandbox="allow-scripts"（缺 allow-same-origin）加载页面。
// 此时连"读取 localStorage 属性"这一步都会抛 SecurityError（不是读写失败），
// 任何直接引用都会让注册、存档整条链路崩在第一步。
// 策略：启动时探测一次；不可用则退化为内存表——功能完整，仅关闭页面后进度不保留。
var Store=(function(){
  var mem={},ok=false;
  try{
    var probe=P+'__probe__';
    window.localStorage.setItem(probe,'1');
    window.localStorage.removeItem(probe);
    ok=true;
  }catch(e){ok=false}
  function ls(){try{return window.localStorage}catch(e){ok=false;return null}}
  return {
    available:function(){return ok},
    get:function(k){
      if(ok){var L=ls();if(L){try{return L.getItem(k)}catch(e){ok=false}}}
      return Object.prototype.hasOwnProperty.call(mem,k)?mem[k]:null;
    },
    set:function(k,v){
      v=String(v);
      if(ok){var L=ls();if(L){try{L.setItem(k,v);return true}catch(e){ok=false}}}
      mem[k]=v;return false;
    },
    remove:function(k){
      if(ok){var L=ls();if(L){try{L.removeItem(k)}catch(e){ok=false}}}
      delete mem[k];
    }
  };
})();

}

function loadProgressFor(nickname){

    progress.items=progress.items||{extraHp:0,hint:0};
    progress.wrongQuestions=progress.wrongQuestions||[];
    progress.masteredKps=progress.masteredKps||{};

  return false;
}

var loginFails = 0, loginTarget = '', regPrefill = '';

const LH = (function(){ return JSON.parse(document.getElementById('lhdata').textContent); })();

(function(){
  var lg = document.getElementById('lhg');
  LH.forEach(function(h,i){
    var c=document.createElement('div');
    c.className='lhc'+(i===0?' sel':'');
    c.dataset.id=h.id;
    c.style.setProperty('--clr',h.clr);
    c.innerHTML='<div class="lhf"><div class="lhi"><img src="'+h.img+'" alt="'+esc(h.name)+'" loading="lazy"></div></div><div class="lhn">'+esc(h.name)+'</div><div class="lht">'+esc(h.title)+'</div>';
    c.addEventListener('click',function(){selHero=h.id;document.querySelectorAll('.lhc').forEach(function(x){x.classList.remove('sel')});c.classList.add('sel')});
    lg.appendChild(c);
  });

  document.getElementById('lpin').addEventListener('input',function(){
    var btn=document.getElementById('lbtn');var pv=this.value;
    if(pv.length===6&&/^\d{6}$/.test(pv)){btn.disabled=false;btn.classList.remove('disabled');btn.setAttribute('aria-disabled','false')}
    else{btn.disabled=false;btn.classList.add('disabled');btn.setAttribute('aria-disabled','true')}
    var errEl=document.getElementById('lerr');
    if(errEl.classList.contains('show')){errEl.classList.remove('show')}
    errEl.classList.remove('info');
    this.classList.remove('input-error');
  });
  // 只用视觉禁用态，不设 disabled 属性：disabled 的 button 不会派发 click，
  // 用户点上去毫无反馈（自动填充密码时 input 事件不触发，按钮会永久卡在灰态）
  document.getElementById('lbtn').disabled=false;
  document.getElementById('lbtn').classList.add('disabled');
  document.getElementById('lbtn').setAttribute('aria-disabled','true');

  document.getElementById('lbtn').addEventListener('click',function(){
    var n=document.getElementById('lnick').value.trim();
    var pv=document.getElementById('lpin').value;
    var errEl=document.getElementById('lerr');
    var pinEl=document.getElementById('lpin');
    function fail(msg){pinEl.value='';errEl.textContent=msg;errEl.classList.add('show');errEl.classList.remove('info');pinEl.classList.add('input-error');setTimeout(function(){pinEl.classList.remove('input-error')},400)}
    if(!n){errEl.textContent='请输入你的冒险者名號';errEl.classList.add('show');document.getElementById('lnick').classList.add('input-error');setTimeout(function(){document.getElementById('lnick').classList.remove('input-error')},400);return}
    if(!pv||pv.length!==6||!/^\d{6}$/.test(pv)){fail('密码需为6位数字');return}
    if(loginTarget&&loginTarget!==n){loginFails=0}
    loginTarget=n;
    // 冷却锁检查（替代原"永久锁定"）
    var remain=lockoutRemaining(n);
    if(remain>0){errEl.textContent='尝试次数过多，请 '+Math.ceil(remain/60000)+' 分钟后再试';errEl.classList.add('show');return}
    var existing=getUserData(n);
    if(existing){
      if(existing.pin!==pv){
        loginFails++;
        if(loginFails>=CFG.LOCK_FAILS){
          Store.set(lockoutKey(n),String(Date.now()+CFG.LOCK_MS));
          loginFails=0;loginTarget='';
          errEl.textContent='密码错误次数过多，账户已临时锁定（'+CFG.LOCK_MS/60000+'分钟后自动解锁）';
          errEl.classList.add('show');
          pinEl.value='';
          return;
        }
        fail('密码错误，请重试（剩余次数：'+(CFG.LOCK_FAILS-loginFails)+'）');
        return;
      }
      loginFails=0;loginTarget='';
      Store.remove(lockoutKey(n));
      // 清理历史遗留的永久锁键（老用户解锁）
      Store.remove(P+'locked_'+n);
      Store.remove(P+'autologin_'+n);
      user=existing;
      loadProgressFor(n);
    }else{
      // 未注册名號不允许直接登录：必须先注册，避免输错一个字就生成空档案
      loginFails=0;loginTarget='';
      regPrefill=n;
      errEl.textContent='本机没有「'+n+'」的档案。请先点下方「新用户注册」创建；换设备或清缓存会导致原档案丢失。';
      errEl.classList.add('show','info');
      var _gr=document.getElementById('go-register');
      if(_gr){_gr.classList.add('attn');setTimeout(function(){_gr.classList.remove('attn')},2000)}
      return;
    }
    saveUserData();
    saveProgress();
    showCV();
  });
})();

  if(n.length>8){regFail(ni,ne,'名號最多 8 个字');return}
  if(!pv||pv.length!==6||!/^\d{6}$/.test(pv)){regFail(pi,pe,'密码需为 6 位数字');return}
  var p2v=p2?p2.value:'';
  if(!p2v||p2v.length!==6||!/^\d{6}$/.test(p2v)){regFail(p2,p2e,'请再次输入 6 位数字密码');return}
  if(p2v!==pv){regFail(p2,p2e,'两次输入的密码不一致，请重新输入');return}

  var existing=null;
  try{existing=getUserData(n)}catch(e){}
  if(existing){regFail(ni,ne,'该名號已存在，请直接登录或换一个名號');return}

  _regBusy=true;
  var oldTxt=sb.textContent;
  sb.textContent='注 册 中…';sb.classList.add('disabled');
  try{
    loginFails=0;loginTarget='';
    loadProgressFor(n);
    user={nickname:n,avatar:selHero,pin:pv};
    saveUserData();
    saveProgress();
    document.getElementById('lnick').value=n;
    ni.value='';pi.value='';if(p2)p2.value='';
    closeRegister();
    showCV();
  }catch(err){
    var _m=(err&&err.message)||'';
    var _tip=/storage|sandbox|SecurityError|quota/i.test(_m)
      ? '当前环境限制了本地存储，请在新窗口打开本页后再注册'
      : '系统繁忙，请稍后重试';
    ne.textContent='注册失败：'+_tip;
    try{console.error('[register]',err)}catch(e2){}
    _regBusy=false;sb.textContent=oldTxt;sb.classList.remove('disabled');
    return;
  }
  setTimeout(function(){sb.textContent=oldTxt;sb.classList.remove('disabled');_regBusy=false},420);
}

function getRank(){

}

// ====== 战斗 =====
let battleState={active:false,towerId:'',floor:1,hp:4,maxHp:4,combo:0,maxCombo:0,correct:0,total:0,questions:[],qIdx:0,timeLeft:30,answers:[],results:[],hintUsed:false,timerInterval:null};

function startTrial(tid){
  // 计时器收口：开新战局前强制清理任何遗留计时器（防双倍速竞态）
  stopBattleTimer();
  var qs=generateQuestions(tid);
  if(!qs.length)return;
  qs=qs.map(shuffleQuestion);
  var hp=CFG.HP||4;
  // 道具接入：额外生命开局自动生效
  var extraNote='';
  progress.items=progress.items||{extraHp:0,hint:0};
  if((progress.items.extraHp||0)>0){
    progress.items.extraHp--;hp+=1;extraNote='💚 额外生命生效：本局生命 +1';
    saveProgress();
  }
  battleState={active:true,towerId:tid,floor:1,hp:hp,maxHp:hp,combo:0,maxCombo:0,correct:0,total:0,questions:qs,qIdx:0,answers:[],results:[],hintUsed:false,timerInterval:null,extraNote:extraNote};
  setScene('battle');
  document.getElementById('ph').style.display='none';
  document.getElementById('pr').style.display='none';
  document.getElementById('pq').style.display='none';
  document.getElementById('pb').style.display='flex';
  updateBackBtn();
  window.scrollTo(0,0);
  renderBattle();
  startBattleTimer();
}

function shuffleQuestion(q){
  var opts=q.options.slice();
  var correctText=opts[q.answer];
  shuffleArr(opts);
  var newAnswer=opts.indexOf(correctText);
  return {question:q.question,options:opts,answer:newAnswer>=0?newAnswer:q.answer,explanation:q.explanation,fig:q.fig,hint:q.hint,level:q.level,floor:q.floor,kp:q.kp};
}

// 每层限时：基础30s → 压轴60s
function timeForFloor(f){return CFG.TIME_BY_FLOOR[Math.max(0,Math.min(3,f-1))]}

function startBattleTimer(){
  stopBattleTimer();
  var s=battleState;
  var q=s.questions[s.qIdx];
  s.timeLeft=timeForFloor(q?q.floor:1);
  updateTimerDisplay();
  s.timerInterval=setInterval(function(){
    if(!battleState.active)return; // 离开后不再后台判错
    battleState.timeLeft--;
    updateTimerDisplay();
    if(battleState.timeLeft<=0){answerQ(-1)}
  },1000);
}
function updateTimerDisplay(){var tel=document.getElementById('btimer');if(tel)tel.textContent=Math.max(0,battleState.timeLeft)+'s'}
function stopBattleTimer(){
  if(battleState&&battleState.timerInterval){clearInterval(battleState.timerInterval);battleState.timerInterval=null}
}
function abandonBattle(){battleState.active=false;stopBattleTimer()}

function generateQuestions(tid){
  var levels=['基础应用','变形提升','综合突破','压轴冲刺'];
  var tw=null;TOWERS.forEach(function(t){if(t.id===tid)tw=t});
  var qs=[];
  for(var f=0;f<4;f++){
    var pool=(Q[tid+'_'+f]||[]).slice();
    if(!pool.length)continue;
    shuffleArr(pool); // Fisher-Yates（替代原比较器有偏洗牌）
    var picked=pool.slice(0,2);
    for(var j=0;j<picked.length;j++){
      var item=picked[j];
      qs.push({
        level:levels[f],floor:f+1,
        kp:(tw&&tw.kps&&tw.kps[f])||'',
        question:item[0],options:[item[1],item[2],item[3],item[4]],
        answer:item[5],explanation:item[6],fig:item[7]||'',hint:item[8]||''
      });
    }
  }
  return qs;
}

function renderBattle(){
  var s=battleState;
  var q=s.questions[s.qIdx];
  var hpPct=Math.max(0,s.hp/s.maxHp*100);
  var hpColor=hpPct>50?'#e0582a':hpPct>25?'#e8964a':'#c05040';
  var hintCount=(progress.items&&progress.items.hint)||0;
  var hintBtn='';
  if(hintCount>0){
    hintBtn='<button class="bhint" onclick="useHint()">💡 提示卡 ×'+hintCount+'</button>';
  }
  document.getElementById('bcnt').innerHTML=
    '<div class="bb"><div class="bt">⚔️ '+esc(q.level)+' · 第'+q.floor+'层'+(q.kp?' · '+esc(q.kp):'')+'</div>'+
    '<div class="bh"><div class="bhb"><div class="bhf" id="hpfill" style="width:'+hpPct+'%;background:linear-gradient(90deg,'+hpColor+','+(hpPct>50?'#e87850':'#d06050')+')"></div></div><span class="bhp" style="color:'+hpColor+'">❤️ '+s.hp+'/'+s.maxHp+'</span></div>'+
    '<div class="bc"><span class="btim">⏱ <span id="btimer">'+s.timeLeft+'s</span></span> <span>连击 <span class="bcc" id="combo">'+s.combo+'x</span></span> <span>'+(s.qIdx+1)+'/'+s.questions.length+'</span></div>'+
    (s.extraNote?'<div class="bnote">'+esc(s.extraNote)+'</div>':'')+
    '<div class="bd">'+esc(q.question)+'</div>'+
    (q.fig?'<div class="bfig" role="img" aria-label="题目配图">'+q.fig+'</div>':'')+
    '<div class="bo">'+q.options.map(function(o,i){return '<button class="boi" onclick="answerQ('+i+')">'+esc(o)+'</button>'}).join('')+'</div>'+
    '<div class="qe" id="exp"></div><div class="bfoot">'+hintBtn+'<button class="qn" id="nb" style="display:none" onclick="nextQ()">下一题 →</button></div></div>';
}

// 道具接入：提示卡展示知识点提示（不剧透答案）
function useHint(){
  var s=battleState;
  if(!s.active)return;
  if(s.hintUsed)return;
  if(!(progress.items&&progress.items.hint>0))return;
  var q=s.questions[s.qIdx];
  progress.items.hint--;saveProgress();
  s.hintUsed=true;
  var exp=document.getElementById('exp');
  if(exp){exp.textContent='💡 提示：'+(q.hint||'回顾本题对应知识点的核心方法');exp.classList.add('show')}
  var hb=document.querySelector('.bhint');if(hb)hb.remove();
}

function revealNextButton(){
  var b=document.getElementById('nb');
  if(!b||b.style.display==='none')return;
  var nav=document.querySelector('.bn');
  var limit=window.innerHeight;
  if(nav&&getComputedStyle(nav).display!=='none')limit=nav.getBoundingClientRect().top;
  var r=b.getBoundingClientRect();
  var need=r.bottom-(limit-10);
  if(need>0)window.scrollBy(0,need);
}

function answerQ(idx){
  if(!battleState.active)return;
  if(battleState.answers[battleState.qIdx]!==undefined)return;
  if(battleState.qIdx>=battleState.questions.length)return;
  var q=battleState.questions[battleState.qIdx];
  var correct=idx===q.answer;
  battleState.answers[battleState.qIdx]=idx;
  battleState.results[battleState.qIdx]=correct;
  battleState.total++;
  var comboMult='';
  if(correct){
    battleState.correct++;
    battleState.combo++;
    if(battleState.combo>battleState.maxCombo)battleState.maxCombo=battleState.combo;
    comboMult=battleState.combo>=5?'⚡ x2':battleState.combo>=3?'🔥 x1.5':''; // emoji修复
  }else{
    battleState.combo=0;battleState.hp--;
    addWrongQuestion(q,idx);
  }
  updateBattleUI(idx,correct,comboMult);
  var b=document.getElementById('nb');
  if(b){
    b.textContent=(battleState.qIdx>=battleState.questions.length-1||battleState.hp<=0)?'查看结果':'下一题 →';
    b.style.display='inline-block';
    setTimeout(revealNextButton,30);
  }
}

// 错题写入（带uid去重+容量上限）
function addWrongQuestion(q,idx){
  progress.wrongQuestions=progress.wrongQuestions||[];
  var uid=uidOf(q.question);
  for(var i=0;i<progress.wrongQuestions.length;i++){
    var w=progress.wrongQuestions[i];
    if((w.uid&&w.uid===uid)||(!w.uid&&w.q===q.question))return; // 去重
  }
  progress.wrongQuestions.push({
    uid:uid,tower:battleState.towerId,
    kp:q.kp||'',q:q.question,options:q.options,answer:q.answer,
    a:idx===-1?'超时未答':q.options[idx],c2:q.options[q.answer],
    e:q.explanation||'',time:Date.now()
  });
  if(progress.wrongQuestions.length>CFG.WRONG_MAX)progress.wrongQuestions=progress.wrongQuestions.slice(-CFG.WRONG_MAX);
  saveProgress();
}

function updateBattleUI(idx,correct,comboMult){
  var s=battleState;
  var q=s.questions[s.qIdx];
  var opts=document.querySelectorAll('.boi');
  for(var i=0;i<opts.length;i++){
    opts[i].classList.add('dis');
    if(i===q.answer)opts[i].classList.add('correct');
    if(i===idx&&!correct)opts[i].classList.add('wrong');
  }
  stopBattleTimer();
  var exp=document.getElementById('exp');
  if(exp){
    var msg=(idx===-1?'⏰ 时间到！':correct?'✓ 正确！':'✗ 错误。')+' '+(q.explanation||'');
    if(correct&&comboMult)msg+=' '+comboMult;
    exp.textContent=msg;exp.classList.add('show');
  }
  var hp=document.getElementById('hpfill');if(hp)hp.style.width=Math.max(0,s.hp/s.maxHp*100)+'%';
  var cb=document.getElementById('combo');if(cb){cb.textContent=s.combo+'x';cb.style.color=s.combo>=5?'#ffd166':s.combo>=3?'#ff9060':'inherit'}
}

function nextQ(){
  if(!battleState.active)return;
  battleState.qIdx++;
  if(battleState.qIdx>=battleState.questions.length||battleState.hp<=0){
    endBattle(battleState.hp>0);
    return;
  }
  battleState.hintUsed=false;
  renderBattle();
  window.scrollTo(0,0);
  startBattleTimer();
}

function endBattle(won){
  abandonBattle(); // active=false + 停表
  setScene('learn');
  progress.xp=progress.xp||0;
  progress.items=progress.items||{extraHp:0,hint:0};
  var s=battleState;
  // 楼层推进按"该层全部答对"计（诚实推进，答错不推进）
  var floorsCleared=0;
  for(var f=1;f<=4;f++){
    var idxs=[],ok=true;
    for(var i=0;i<s.questions.length;i++){if(s.questions[i].floor===f)idxs.push(i)}
    if(!idxs.length)continue;
    for(var j=0;j<idxs.length;j++){if(s.results[idxs[j]]!==true){ok=false;break}}
    if(ok)floorsCleared++;
  }
  var comboMult=s.maxCombo>=5?2:s.maxCombo>=3?1.5:1;
  var starsEarned=won?Math.round(3*comboMult):0;
  var xpEarned=s.correct*10*comboMult+(won?20:0);
  progress.xp+=xpEarned;

  var td=progress.towers[s.towerId]||{floors:0,stars:0,total:0,correct:0};
  // 修正：记录具体通过的层，避免"只在第3层全对却显示3/4"的虚高
  if(!td.floorFlags||td.floorFlags.length!==4){
    td.floorFlags=[false,false,false,false];
    var legacy=Math.min(td.floors||0,4);
    for(var lf=0;lf<legacy;lf++)td.floorFlags[lf]=true;
  }
  for(var cf=1;cf<=4;cf++){
    var anyQ=false,allOk=true;
    for(var qi=0;qi<s.questions.length;qi++){
      if(s.questions[qi].floor!==cf)continue;
      anyQ=true;
      if(s.results[qi]!==true){allOk=false;break}
    }
    if(anyQ&&allOk)td.floorFlags[cf-1]=true;
  }
  td.floors=0;for(var ff=0;ff<4;ff++){if(td.floorFlags[ff])td.floors++}
  td.stars=(td.stars||0)+starsEarned;
  td.total=(td.total||0)+s.total;
  td.correct=(td.correct||0)+s.correct;
  progress.towers[s.towerId]=td;
  progress.totalStars=0;for(var k in progress.towers){progress.totalStars+=(progress.towers[k].stars||0)}

  // 连击=连续天数（断签清零，仅试炼日计入）
  progress.streak=progress.streak||{count:0,lastDate:''};
  var today=todayStr();
  if(progress.streak.lastDate!==today){
    if(progress.streak.lastDate===yesterdayStr()){progress.streak.count++}
    else{progress.streak.count=1}
    progress.streak.lastDate=today;
  }

  // 每日奖励：真实按日发放
  var dailyCheck='';
  if(progress.dailyCompleted!==today){
    progress.dailyCompleted=today;
    progress.xp+=CFG.XP_DAILY||30;
    dailyCheck='<div class="rbonus daily">🎉 每日试炼奖励 +'+(CFG.XP_DAILY||30)+' XP</div>';
  }

  // 道具掉落
  var loot='';
  if(Math.random()<CFG.DROP_RATE){
    var items=['extraHp','hint'];
    var pick=items[Math.floor(Math.random()*items.length)];
    progress.items[pick]=(progress.items[pick]||0)+1;
    loot='<div class="rbonus loot">🎁 获得道具：'+(pick==='extraHp'?'💚 额外生命':'💡 提示卡')+' ×1</div>';
  }
  saveProgress();
  updateStats();

  document.getElementById('rcnt').innerHTML=
    '<div class="rc"><div class="ri">'+(floorsCleared===4?'🏆':(won?'🎯':'💪'))+'</div><div class="rn">'+(floorsCleared===4?'试炼通关！':(won?'挑战完成':'挑战失败'))+'</div><div class="rs">本次通过 '+floorsCleared+'/4 层 · 最高连击 '+s.maxCombo+'x</div>'+
    '<div class="rss"><div class="rsi"><div class="rsv">'+s.correct+'/'+s.total+'</div><div class="rsl">正确率</div></div><div class="rsi"><div class="rsv">'+s.maxCombo+'x</div><div class="rsl">最高连击</div></div><div class="rsi"><div class="rsv">⭐+'+starsEarned+'</div><div class="rsl">星辉 ×'+comboMult+'</div></div><div class="rsi"><div class="rsv">+'+xpEarned+'</div><div class="rsl">经验值</div></div></div>'+
    loot+dailyCheck+
    '<button class="rba" onclick="retryTrial()">🔄 重新挑战</button><button class="rbb" onclick="goHome()">🏰 返回试炼塔</button></div>';
  document.getElementById('pb').style.display='none';
  document.getElementById('pr').style.display='block';
  window.scrollTo(0,0);
  updateBackBtn();
}

function retryTrial(){startTrial(battleState.towerId)}

// ====== 战绩页 =====
function renderStats(){
  var allT=0,allC=0,allStars=0;
  for(var tid in progress.towers){
    var td=progress.towers[tid]||{};
    allT+=td.total||0;allC+=td.correct||0;allStars+=td.stars||0;
  }
  var acc=allT?Math.round(allC/allT*100):0;
  var completed=0;
  TOWERS.forEach(function(t){var td=progress.towers[t.id]||{};if((td.floors||0)>=(TOWER_FLOORS[t.id]||4))completed++});
  var rank=getRank();
  var pct=Math.min(100,Math.round(completed/TOWERS.length*100));
  var html='';
  html+='<div class="rhead" style="border-color:'+rank.clr+'55">';
  html+='<div style="font-size:2.5rem;margin-bottom:4px">'+rank.name.split(' ')[0]+'</div>';
  html+='<div style="font-size:1.1rem;font-weight:700;color:'+rank.clr+'">'+esc(rank.name)+'</div>';
  html+='<div style="width:100%;height:8px;border-radius:4px;background:var(--border);margin:10px 0"><div style="width:'+pct+'%;height:100%;border-radius:4px;background:linear-gradient(90deg,'+rank.clr+',var(--accent));transition:width .6s"></div></div>';
  html+='<div style="font-size:.75rem;color:var(--t3)">'+completed+'/'+TOWERS.length+' 征服 · '+pct+'%</div></div>';
  html+='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 16px">';
  html+='<div class="rc3"><div class="rv">'+allT+'</div><div class="rl2">总答题</div></div>';
  html+='<div class="rc3"><div class="rv" style="color:'+(acc>=80?'var(--ok)':acc>=50?'var(--gold)':'var(--err)')+'">'+acc+'%</div><div class="rl2">正确率</div></div>';
  html+='<div class="rc3"><div class="rv" style="color:var(--gold)">'+allStars+' ⭐</div><div class="rl2">星辉</div></div>';
  html+='<div class="rc3"><div class="rv">'+(progress.streak?progress.streak.count:0)+'</div><div class="rl2">连续天数</div></div></div>';
  // 各塔进度：新账号也展示，给出"下一站去哪"的清晰路径（R5）
  html+='<div class="sh"><div class="st">⚔️ 各塔进度</div></div><div class="cl">';
  TOWERS.forEach(function(t){
    var td=progress.towers[t.id]||{};
    var TF=TOWER_FLOORS[t.id]||4;
    var fl=Math.min(td.floors||0,TF);
    html+='<div class="cc"><div class="cr"><div style="font-size:1.2rem">'+t.icon+'</div>';
    html+='<div class="cb"><div style="font-size:.85rem;font-weight:600;color:var(--t1)">'+esc(t.name)+'</div>';
    html+='<div style="margin-top:6px" role="img" aria-label="已通过 '+fl+'/'+TF+' 层">';
    for(var f=0;f<TF;f++){html+='<span style="display:inline-block;width:16px;height:4px;border-radius:2px;margin-right:4px;background:'+(f<fl?(TF===fl?'var(--ok)':'var(--accent)'):'var(--border)')+'"></span>'}
    html+='</div></div>';
    html+='<div style="font-size:.75rem;color:var(--accent);white-space:nowrap">'+fl+'/'+TF+' 层</div></div></div>';
  });
  html+='</div>';
  document.getElementById('sc2').innerHTML=html;
}

// ====== 错题复习 =====
var reviewActive=false,reviewQs=[],reviewIdx=0,reviewResults=[];

function renderReview(){
  var wq=progress.wrongQuestions||[];
  var hasDone=0;for(var tid in progress.towers){hasDone+=(progress.towers[tid]||{}).total||0}
  if(!wq.length&&!hasDone){
    document.getElementById('rc').innerHTML='<div class="es"><div class="ei">🔄</div><div class="et">完成试炼后，这里会生成强化训练计划</div></div>';
    return;
  }
  var kpCount={};
  wq.forEach(function(w){if(w.kp){kpCount[w.kp]=(kpCount[w.kp]||0)+1}});
  var kps=Object.keys(kpCount).sort(function(a,b){return kpCount[b]-kpCount[a]});
  if(!kps.length){
    document.getElementById('rc').innerHTML='<div class="es"><div class="ei">🎯</div><div class="et">去试炼塔挑战，积累错题后生成复习计划</div></div>';
    return;
  }
  var mastered=0;var mk=progress.masteredKps||{};for(var k in mk){if(mk[k]>0)mastered++}
  var html='<div class="sh"><div class="st">🎯 强化训练 · 知识点巩固</div></div>';
  html+='<div style="font-size:.8rem;color:var(--t2);margin:0 0 12px;padding:0 8px">针对薄弱知识点逐题攻克，答对的题自动移出错题本</div>';
  kps.forEach(function(kp){
    var count=kpCount[kp];
    html+='<div class="kpcard">'+
      '<div><div style="font-size:.9rem;font-weight:600;color:var(--t1)">📌 '+esc(kp)+'</div>'+
      '<div style="font-size:.75rem;color:var(--t3);margin-top:2px">错题 '+count+' 道 · 需强化巩固</div></div>'+
      '<button class="kbtn" data-kp="'+esc(kp)+'">⚔ 开始训练</button></div>';
  });
  html+='<div class="rsum">'+
    '<div style="font-size:.8rem;color:var(--t2)">📊 复习统计</div>'+
    '<div style="display:flex;justify-content:space-around;margin-top:8px">'+
    '<div><div style="font-size:1.1rem;font-weight:700;color:var(--gold)">'+wq.length+'</div><div style="font-size:.75rem;color:var(--t3)">错题总数</div></div>'+
    '<div><div style="font-size:1.1rem;font-weight:700;color:var(--accent)">'+kps.length+'</div><div style="font-size:.75rem;color:var(--t3)">薄弱知识点</div></div>'+
    '<div><div style="font-size:1.1rem;font-weight:700;color:var(--ok)">'+mastered+'</div><div style="font-size:.75rem;color:var(--t3)">已掌握</div></div>'+
    '</div></div>';
  document.getElementById('rc').innerHTML=html;
  // 事件委托：知识点名可能含引号，内联 onclick 拼接会被 HTML 实体还原破坏
  var rc=document.getElementById('rc');
  if(!rc._kpBound){
    rc._kpBound=true;
    rc.addEventListener('click',function(e){
      var b=e.target.closest?e.target.closest('.kbtn'):null;
      if(b&&b.dataset.kp)startKpPractice(b.dataset.kp);
    });
  }
}

// 组卷（复习系统重写：多题推进 + 按uid删除）
function startKpPractice(kp){
  var wq=progress.wrongQuestions||[];
  var related=wq.filter(function(w){return w.kp===kp});
  if(!related.length)return;
  reviewActive=true;reviewIdx=0;reviewResults=[];reviewQs=[];
  related.forEach(function(w,i){
    var opts=w.options.slice();
    var correctText=opts[w.answer];
    shuffleArr(opts);
    var newAns=opts.indexOf(correctText);
    reviewQs.push({uid:w.uid||uidOf(w.q),q:w.q,options:opts,answer:newAns>=0?newAns:w.answer,e:w.e,kp:kp});
  });
  document.getElementById('prv').style.display='none';
  document.getElementById('pq').style.display='block';
  document.getElementById('rqc').innerHTML='<div class="sh"><div class="st">⚔ 强化训练：'+esc(kp)+'</div></div><div style="font-size:.8rem;color:var(--t2);margin-bottom:10px;padding:0 4px">共 '+reviewQs.length+' 题 · 第 1 题开始 · 答对自动移出错题本</div><div id="rqb"></div>';
  showReviewQ();
}

function showReviewQ(){
  reviewAnswered=false;
  if(reviewIdx>=reviewQs.length){finishReviewQuiz();return}
  var q=reviewQs[reviewIdx];
  document.getElementById('rqb').innerHTML='<div class="rqcard"><div style="font-size:.78rem;color:var(--accent);margin-bottom:8px">⚔️ 错题攻克 · 第'+(reviewIdx+1)+'/'+reviewQs.length+'题</div><div style="font-size:.95rem;font-weight:600;color:var(--t1);margin-bottom:14px;line-height:1.6">'+esc(q.q)+'</div><div class="bo">'+q.options.map(function(o,i){return '<button class="boi" onclick="answerReview('+i+')">'+esc(o)+'</button>'}).join('')+'</div><div class="qe" id="rexp" style="margin-top:10px"></div></div>';
}

var reviewAnswered=false;
function answerReview(idx){
  if(reviewAnswered)return;
  var btns=document.querySelectorAll('#rqb .boi');
  if(!btns.length)return;
  reviewAnswered=true;
  for(var i=0;i<btns.length;i++){btns[i].classList.add('dis');btns[i].disabled=true}
  var q=reviewQs[reviewIdx];
  var correct=idx===q.answer;
  reviewResults.push(correct);
  btns[q.answer].classList.add('correct');
  if(!correct)btns[idx].classList.add('wrong');
  if(correct){
    // 按uid（或文本回退）删除错题，杜绝索引快照错位
    var wq=progress.wrongQuestions||[];
    var pos=-1;
    for(var j=0;j<wq.length;j++){
      var w=wq[j];
      if((w.uid&&w.uid===q.uid)||(!w.uid&&w.q===q.q)){pos=j;break}
    }
    if(pos>=0){wq.splice(pos,1);saveProgress()}
  }
  var exp=document.getElementById('rexp');
  if(exp){exp.textContent=(correct?'✓ 正确！已从错题本移除':'✗ 错误。继续加油！')+' '+(q.e||'');exp.classList.add('show')}
  var last=reviewIdx>=reviewQs.length-1;
  var btn=document.createElement('button');
  btn.className='qn';btn.style.marginTop='8px';
  btn.setAttribute('onclick',last?'finishReviewQuiz()':'nextReviewQ()');
  btn.textContent=last?(correct?'✅ 完成训练':'继续最后一题'):(correct?'下一题 →':'看解析下一题 →');
  document.getElementById('rqb').appendChild(btn);
}

function nextReviewQ(){reviewAnswered=false;reviewIdx++;showReviewQ()}

function finishReviewQuiz(){
  reviewActive=false;
  var c=reviewResults.filter(function(r){return r}).length;
  var t=reviewResults.length;
  var allCorrect=t>0&&c===t;
  var rate=t>0?Math.round(c/t*100):0;
  if(allCorrect&&reviewQs.length&&reviewQs[0].kp){
    progress.masteredKps=progress.masteredKps||{};
    progress.masteredKps[reviewQs[0].kp]=(progress.masteredKps[reviewQs[0].kp]||0)+1;
    saveProgress();
  }
  document.getElementById('rqb').innerHTML='<div style="text-align:center;padding:24px"><div style="font-size:2.5rem;margin-bottom:8px">'+(allCorrect?'🎉':'💪')+'</div><div style="font-size:1.4rem;font-weight:700;color:var(--t1)">'+(allCorrect?'训练完成！':'继续加油')+'</div><div style="font-size:.85rem;color:var(--t2);margin:8px 0">正确率：'+c+'/'+t+'（'+rate+'%）</div><div style="font-size:.78rem;color:var(--t3)">答对的题目已移出错题本</div><button class="qn" onclick="switchPageTrial(\'review\')" style="margin:8px 4px">📊 返回复习</button></div>';
  updateStats();
}

function renderWrong(){
  var wq=progress.wrongQuestions||[];
  if(!wq.length){
    document.getElementById('wc2').innerHTML='<div class="es"><div class="ei">🎉</div><div class="et">暂无错题，继续保持！</div></div>';
    return;
  }
  var twName={};TOWERS.forEach(function(t){twName[t.id]=t.name});
  var shown=wq.slice(-50).reverse();
  var more=wq.length-shown.length;
  var html='<div class="sh"><div class="st">📋 错题清单 · 共 '+wq.length+' 道'+(more>0?'（显示最近 '+shown.length+' 道）':'')+'</div></div><div class="wl">';
  shown.forEach(function(w){
    html+='<div class="wc"><div class="wcq">❌ '+esc(w.q)+'</div>'+
      '<div class="wca"><span class="wa">✗ 你的答案：'+esc(w.a)+'</span><span class="wcok">✓ 正确答案：'+esc(w.c2)+'</span></div>'+
      '<div class="wce">'+esc(w.e)+'</div>'+
      '<div class="wcf"><span>'+esc(twName[w.tower]||w.tower)+'</span><span>'+(w.time?new Date(w.time).toLocaleDateString():'—')+'</span></div></div>';
  });
  html+='</div>';
  document.getElementById('wc2').innerHTML=html;
}

// ====== 导航 =====
function confirmLeave(kind){
  if(kind==='battle'&&battleState.active){return confirm('试炼正在进行，离开将放弃本次挑战。确定离开吗？')}
  if(kind==='review'&&reviewActive){return confirm('强化训练正在进行，离开将结束本次训练。确定离开吗？')}
  return true;
}
function switchPageTrial(page){
  // 离开确认护栏（P1-7）
  if(document.getElementById('pb').style.display!=='none'||battleState.active){
    if(!confirmLeave('battle'))return;
    abandonBattle();setScene('learn');
  }
  if(reviewActive||document.getElementById('pq').style.display==='block'){
    if(!confirmLeave('review'))return;
    reviewActive=false;reviewAnswered=false;
  }
  var navs=document.querySelectorAll('.ni');
  for(var i=0;i<navs.length;i++)navs[i].classList.remove('active');
  var nav=document.querySelector('.ni[data-page="'+page+'"]');
  if(nav)nav.classList.add('active');
  document.getElementById('ph').style.display='none';
  document.getElementById('pb').style.display='none';
  document.getElementById('pr').style.display='none';
  document.getElementById('psx').style.display='none';
  document.getElementById('prv').style.display='none';
  document.getElementById('pw').style.display='none';
  document.getElementById('pq').style.display='none';
  var map={home:'ph',stats:'psx',review:'prv',wrong:'pw'};
  var tid=map[page];
  if(tid){var el=document.getElementById(tid);if(el)el.style.display='block'}
  updateStats(); // 共享头部摘要随页面切换刷新（R5）
  if(page==='home')renderTowers()
  if(page==='stats')renderStats();
  if(page==='review')renderReview();
  if(page==='wrong')renderWrong();
  // R5：战绩页已含完整指标，隐去顶部摘要条避免重复；助手条仅首页出现
  var _ss=document.querySelector('.ss'),_tsb=document.querySelector('.tsb');
  if(_ss)_ss.style.display=(page==='stats')?'none':'';
  if(_tsb)_tsb.style.display=(page==='home')?'':'none';
  updateBackBtn();
}
function goHome(){
  switchPageTrial('home');
  document.getElementById('pr').style.display='none';
  renderTowers();
  updateBackBtn();
}

// ====== 返回/锁定/退出 =====
function updateBackBtn(){
  var b=document.getElementById('back-btn');if(!b)return;
  var pb=document.getElementById('pb'),pr=document.getElementById('pr'),pq=document.getElementById('pq');
  var vis=function(el){return !!el&&(el.style.display==='block'||el.style.display==='flex')};
  var inBattleOrResult=vis(pb)||vis(pr)||vis(pq);
  b.style.display=inBattleOrResult?'inline-flex':'none';
}
function goBack(){
  if(document.getElementById('pb').style.display!=='none'){
    if(!confirmLeave('battle'))return;
    abandonBattle();setScene('learn');
    switchPageTrial('home');return;
  }
  if(document.getElementById('pq').style.display==='block'||reviewActive){
    if(!confirmLeave('review'))return;
    reviewActive=false;reviewAnswered=false;switchPageTrial('review');return;
  }
  if(document.getElementById('pr').style.display!=='none'){switchPageTrial('home');return}
  goHome();
}
function doLock(){
  if(!user)return;
  if(battleState.active){if(!confirmLeave('battle'))return;abandonBattle()}
  loginFails=0;loginTarget='';
  document.getElementById('action-toolbar').style.display='none';
  showLockView();
}
function doLogout(){
  if(!confirm('确定退出登录吗？'))return;
  if(battleState.active){abandonBattle()}
  user=null;
  document.getElementById('action-toolbar').style.display='none';
  showLV();
}

// 切页检测（visibilitychange）：战斗中离开超过3秒，回来时提醒专注
var _hiddenAt=0;
document.addEventListener('visibilitychange',function(){
  if(document.hidden){_hiddenAt=Date.now()}
  else if(battleState.active&&_hiddenAt&&Date.now()-_hiddenAt>3000){
    var exp=document.getElementById('exp');
    if(exp&&battleState.answers[battleState.qIdx]===undefined){exp.textContent='👀 检测到切页，请专注当前试炼！';exp.classList.add('show')}
    _hiddenAt=0;
  }
});

// ====== popstate 语义化（不再强制登出，战斗中拦截确认） ======
window.addEventListener('popstate',function(e){
  if(battleState.active){
    if(confirm('试炼正在进行，离开将放弃本次挑战。确定离开吗？')){
      abandonBattle();setScene('learn');switchPageTrial('home');
    }else{
      try{history.pushState({page:'game'},'',location.pathname+location.search+(location.hash||'#game'))}catch(err){}
    }
    return;
  }
  if(reviewActive){
    if(confirm('强化训练正在进行，离开将结束本次训练。确定离开吗？')){
      reviewActive=false;
      switchPageTrial('review');
    }else{
      try{history.pushState({page:'game'},'',location.pathname+location.search+(location.hash||'#game'))}catch(err){}
    }
    return;
  }
  // 登录态保持：不登出、不重置进度
});

// ====== Init ======
showLV();
// 首次使用（本机没有任何档案）：先引导注册，未注册不能直接进入
(function(){
  if(hasAnyProfile())return;
  setTimeout(function(){try{showRegister(true)}catch(e){}},320);
})();

// 功能不降级（适配层走内存表），但必须明确告知"本次进度不保存"，避免用户误以为存档成功
(function(){
  if(Store.available())return;
  var el=document.getElementById('lenv');
  if(el)el.classList.add('show');
})();
